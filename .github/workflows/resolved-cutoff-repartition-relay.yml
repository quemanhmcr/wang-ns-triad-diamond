name: Resolved cutoff repartition relay
on:
  push:
    paths:
      - 'src/resolved_cutoff_repartition_relay.py'
      - 'tests/test_resolved_cutoff_repartition_relay.py'
      - 'docs/resolved_cutoff_repartition_relay.md'
      - '.github/workflows/resolved-cutoff-repartition-relay.yml'
      - 'src/outer_moving_role_extraction.py'
      - 'src/smooth_material_carrier_relay.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.resolved_cutoff_repartition_relay --samples 50000 --outdir results-resolved-cutoff-repartition-relay
      - run: python -m src.smooth_material_carrier_relay --samples 50000 --outdir results-smooth-material-carrier-relay
      - run: python -m src.outer_moving_role_extraction --samples 50000 --outdir results-outer-moving-role-extraction
      - run: cat results-resolved-cutoff-repartition-relay/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-cutoff-repartition-relay-results
          path: |
            results-resolved-cutoff-repartition-relay/
            results-smooth-material-carrier-relay/
            results-outer-moving-role-extraction/
