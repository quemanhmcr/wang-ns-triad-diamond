name: objective-helical-polarization
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Objective helical polarization stress
        run: python -m src.objective_helical_polarization --samples 50000 --outdir results-objective-helical
      - run: cat results-objective-helical/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: objective-helical-polarization-results
          path: results-objective-helical/
