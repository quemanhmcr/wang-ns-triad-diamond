name: Bandlimited source sampling
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.bandlimited_source_sampling --samples 50000 --outdir results-bandlimited-source-sampling
      - run: cat results-bandlimited-source-sampling/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bandlimited-source-sampling-results
          path: results-bandlimited-source-sampling/
