name: Audit cyclic hard-cell single-charge quotient

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/cyclic_hard_cell_single_charge_quotient.py'
      - 'tests/test_cyclic_hard_cell_single_charge_quotient.py'
      - 'src/cyclic_hard_cell_single_charge_quotient_pde_probe.py'
      - 'tests/test_cyclic_hard_cell_single_charge_quotient_pde_probe.py'
      - 'src/cyclic_helical_triad_donor_kernel.py'
      - 'src/cyclic_helical_triad_donor_kernel_pde_probe.py'
      - 'src/canonical_positive_edge_work_routing.py'
      - 'src/mixed_fate_reserved_young_handoff.py'
      - 'src/physical_branch_compiler.py'
      - '.github/workflows/audit-cyclic-hard-cell-single-charge-quotient.yml'
      - '.github/workflows/cyclic-hard-cell-single-charge-quotient.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  independent-algebra-provenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused theorem and anti-theorem tests
        run: pytest -q tests/test_cyclic_hard_cell_single_charge_quotient.py tests/test_cyclic_helical_triad_donor_kernel.py tests/test_canonical_positive_edge_work_routing.py tests/test_mixed_fate_reserved_young_handoff.py tests/test_physical_branch_compiler.py
      - name: Independent 100k hard-cell single-charge stress
        run: python -m src.cyclic_hard_cell_single_charge_quotient --samples 100000 --seed 2026081292 --outdir audit-hard-cell-single-charge/analytic
      - name: Independent cyclic donor provenance stress
        run: python -m src.cyclic_helical_triad_donor_kernel --samples 100000 --seed 2026081291 --outdir audit-hard-cell-single-charge/cyclic-dependency
      - name: Summary
        run: |
          cat audit-hard-cell-single-charge/analytic/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat audit-hard-cell-single-charge/cyclic-dependency/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-cyclic-hard-cell-single-charge-analytic-results
          path: audit-hard-cell-single-charge/

  independent-actual-ns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused actual-NS theorem tests
        run: pytest -q tests/test_cyclic_hard_cell_single_charge_quotient_pde_probe.py tests/test_cyclic_helical_triad_donor_kernel_pde_probe.py
      - name: Longer positive-phase evolved NS audit
        run: python -m src.cyclic_hard_cell_single_charge_quotient_pde_probe --resolutions 24 28 --cutoff 7 --steps 48 --amplitude 1.3 --duration 0.0012 --snapshots 6 --phase-sign 1 --outdir audit-hard-cell-single-charge-ns/positive-phase
      - name: Longer negative-phase evolved NS audit
        run: python -m src.cyclic_hard_cell_single_charge_quotient_pde_probe --resolutions 24 28 --cutoff 7 --steps 48 --amplitude 1.3 --duration 0.0012 --snapshots 6 --phase-sign -1 --outdir audit-hard-cell-single-charge-ns/negative-phase
      - name: Existing mixed-fate actual-NS dependency
        run: python -m src.mixed_fate_reserved_young_handoff_pde_probe --resolution 24 --steps 32 --duration 0.001 --snapshots 5 --outdir audit-hard-cell-single-charge-ns/mixed-fate
      - name: Summary
        run: |
          for f in audit-hard-cell-single-charge-ns/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-cyclic-hard-cell-single-charge-actual-ns-results
          path: audit-hard-cell-single-charge-ns/
