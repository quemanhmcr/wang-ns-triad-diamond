name: Sideband coherence daughter theorem
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.sideband_coherence_daughter --samples 20000 --outdir results-sideband-coherence-daughter
      - run: cat results-sideband-coherence-daughter/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sideband-coherence-daughter-results
          path: results-sideband-coherence-daughter/
