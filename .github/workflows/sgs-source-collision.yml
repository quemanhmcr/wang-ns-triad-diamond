name: SGS source collision
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.sgs_source_collision --samples 50000 --outdir results-sgs-source-collision
      - run: cat results-sgs-source-collision/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sgs-source-collision-results
          path: results-sgs-source-collision/
