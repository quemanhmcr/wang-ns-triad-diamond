name: Affine SGS boundary ledger
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Affine SGS boundary stress
        run: python -m src.affine_sgs_boundary_ledger --samples 50000 --outdir results-affine-sgs-boundary
      - run: cat results-affine-sgs-boundary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-sgs-boundary-results
          path: results-affine-sgs-boundary/
