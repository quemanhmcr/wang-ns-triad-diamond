name: Affine Kelvin packet PDE
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Affine Kelvin PDE stress
        run: python -m src.affine_kelvin_packet_pde --samples 50000 --outdir results-affine-kelvin-packet-pde
      - run: cat results-affine-kelvin-packet-pde/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-kelvin-packet-pde-results
          path: results-affine-kelvin-packet-pde/
