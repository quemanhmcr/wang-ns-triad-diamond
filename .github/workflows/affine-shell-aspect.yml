name: Affine shell aspect
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb shell/aspect certificate and stress
        run: python -m src.affine_shell_aspect --samples 50000 --outdir results-affine-shell-aspect
      - run: cat results-affine-shell-aspect/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-shell-aspect-results
          path: results-affine-shell-aspect/
