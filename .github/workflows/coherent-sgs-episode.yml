name: Coherent SGS source episode
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.coherent_sgs_episode --samples 50000 --outdir results-coherent-sgs-episode
      - run: cat results-coherent-sgs-episode/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-sgs-episode-results
          path: results-coherent-sgs-episode/
