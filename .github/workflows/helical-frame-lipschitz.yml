name: helical-frame-lipschitz
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb good-core angle and frame stress
        run: python -m src.helical_frame_lipschitz --samples 50000 --outdir results-helical-frame-lipschitz
      - run: cat results-helical-frame-lipschitz/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: helical-frame-lipschitz-results
          path: results-helical-frame-lipschitz/
