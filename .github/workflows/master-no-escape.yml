name: master-no-escape
on: workflow_dispatch
permissions:
  contents: read
jobs:
  theorem-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - name: Master episode stress-test
        run: |
          python - <<'PY'
          import json, math, random
          from src.master_no_escape import MasterStep, master_lower_bound, verify_episode_trace

          rng = random.Random(20260807)
          worst = 1e9
          checked = 0
          for _ in range(20000):
              c0 = 0.04
              kappa = rng.uniform(0.12, 0.30)
              reset = rng.uniform(kappa, 1.4)
              nepisodes = rng.randint(1, 12)
              episodes = []
              all_steps = []

              for e in range(nepisodes):
                  p = reset
                  ep = []
                  for _j in range(rng.randint(0, 20)):
                      z = rng.uniform(0.0, 0.015)
                      if p - kappa + z < 0:
                          break
                      p = p - kappa + z
                      s = MasterStep(1.0, 0.0, 0.0, True, z)
                      ep.append(s)
                      all_steps.append(s)
                  episodes.append(ep)
                  if e + 1 < nepisodes:
                      cost = rng.uniform(c0, 0.5)
                      eta = rng.uniform(0.0, 0.002)
                      eff = min(1.0, math.exp(-cost) + eta)
                      all_steps.append(MasterStep(eff, cost, eta, False))

              epcheck = verify_episode_trace(
                  episodes, c0=c0, kappa0=kappa, potential_reset=reset
              )
              if not epcheck['admissible']:
                  raise SystemExit('generated inadmissible episode trace')

              out = master_lower_bound(
                  all_steps, c0=c0, kappa0=kappa, potential_reset=reset
              )
              actual = sum(-math.log(min(1.0, s.efficiency)) for s in all_steps)
              margin = actual - float(out['log_efficiency_lower_bound'])
              worst = min(worst, margin)
              checked += 1

          print(json.dumps({'checked': checked, 'worst_margin': worst}, indent=2))
          if worst < -1e-10:
              raise SystemExit(1)
          PY
