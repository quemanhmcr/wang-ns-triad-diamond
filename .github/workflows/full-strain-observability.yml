name: full-strain-observability
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb full-strain certificate and stress
        run: python -m src.full_strain_observability --samples 100000 --outdir results-full-strain
      - run: cat results-full-strain/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-strain-observability-results
          path: results-full-strain/
