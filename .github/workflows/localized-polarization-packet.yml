name: Localized polarization packet
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb constants and localized packet stress
        run: python -m src.localized_polarization_packet --samples 50000 --outdir results-localized-polarization
      - run: cat results-localized-polarization/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: localized-polarization-packet-results
          path: results-localized-polarization/
