name: annular-pressure-collision
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Pressure multipole collision stress
        run: python -m src.annular_pressure_collision --samples 50000 --outdir results-annular-pressure
      - uses: actions/upload-artifact@v4
        with:
          name: annular-pressure-collision-results
          path: results-annular-pressure/
