name: Hermite triad selection theorem
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.hermite_triad_selection --samples 50000 --outdir results-hermite-triad-selection
      - run: cat results-hermite-triad-selection/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: hermite-triad-selection-results
          path: results-hermite-triad-selection/
