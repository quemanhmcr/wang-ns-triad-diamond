name: Hard-tail true upward supply

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/hard_tail_true_upward_supply.py'
      - 'tests/test_hard_tail_true_upward_supply.py'
      - 'src/hard_tail_true_upward_supply_pde_probe.py'
      - 'tests/test_hard_tail_true_upward_supply_pde_probe.py'
      - 'docs/hard_tail_true_upward_supply.md'
      - 'src/radial_spectral_crossing_layer_cake.py'
      - 'src/radial_spectral_crossing_layer_cake_pde_probe.py'
      - 'src/helical_mode_set_energy_continuity.py'
      - 'src/cyclic_helical_triad_donor_kernel.py'
      - 'src/cyclic_helical_triad_donor_kernel_pde_probe.py'
      - 'src/high_frequency_dissipation_reentry.py'
      - 'src/continuum_helical_edge_measure_registration.py'
      - 'src/continuum_helical_edge_measure_pde_probe.py'
      - 'src/helical.py'
      - '.github/workflows/hard-tail-true-upward-supply.yml'
      - '.github/workflows/audit-hard-tail-true-upward-supply.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  analytic-and-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused true-upward supply tests
        run: pytest -q tests/test_hard_tail_true_upward_supply.py
      - name: Physical radial/tail dependency tests
        run: pytest -q tests/test_radial_spectral_crossing_layer_cake.py tests/test_helical_mode_set_energy_continuity.py tests/test_cyclic_helical_triad_donor_kernel.py tests/test_high_frequency_dissipation_reentry.py
      - name: Full theorem suite
        run: pytest -q
      - name: Physical true-upward support stress
        run: python -m src.hard_tail_true_upward_supply --samples 75000 --seed 2026081207 --outdir results-true-upward/main
      - name: Radial crossing dependency stress
        run: python -m src.radial_spectral_crossing_layer_cake --samples 75000 --seed 2026081206 --outdir results-true-upward/radial-dependency
      - name: Hard-tail dissipation dependency stress
        run: python -m src.high_frequency_dissipation_reentry --samples 50000 --outdir results-true-upward/high-tail-dependency
      - name: Summary
        run: |
          for f in results-true-upward/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hard-tail-true-upward-supply-analytic-results
          path: results-true-upward/

  actual-ns:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused evolved NS true-upward tests
        run: pytest -q tests/test_hard_tail_true_upward_supply_pde_probe.py tests/test_radial_spectral_crossing_layer_cake_pde_probe.py
      - name: Actual NS full-tail plus pure/deep upward support
        run: >-
          python -m src.hard_tail_true_upward_supply_pde_probe
          --main-resolutions 24 28 --deep-resolutions 20 24
          --main-cutoff 7 --deep-cutoff 2
          --main-steps 64 --deep-steps 24 --closed-tail-resolutions 20 24 --closed-tail-steps 32
          --main-duration 0.001 --deep-duration 0.00025 --closed-tail-duration 0.00035
          --outdir results-true-upward-ns/main
      - name: Sign-reversed radial downward dependency
        run: >-
          python -m src.radial_spectral_crossing_layer_cake_pde_probe
          --resolutions 24 28 --cutoff 7 --steps 64 --duration 0.001
          --radius 8 --phase-sign -1 --outdir results-true-upward-ns/downward-dependency
      - name: Amplitude adversaries
        run: |
          for a in 0.5 2.0; do
            tag=${a/./p}
            python -m src.hard_tail_true_upward_supply_pde_probe \
              --main-resolutions 24 --deep-resolutions 20 \
              --main-cutoff 7 --deep-cutoff 2 \
              --main-steps 32 --deep-steps 12 --closed-tail-resolutions 20 --closed-tail-steps 12 \
              --main-duration 0.0005 --deep-duration 0.00012 --closed-tail-duration 0.00015 \
              --amplitude "$a" --outdir "results-true-upward-ns/amplitude-$tag"
          done
      - name: Summary
        run: |
          for f in results-true-upward-ns/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hard-tail-true-upward-supply-actual-ns-results
          path: results-true-upward-ns/
