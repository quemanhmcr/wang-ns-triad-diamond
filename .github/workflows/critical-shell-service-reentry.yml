name: Critical shell service reentry

on:
  push:
    paths:
      - 'src/critical_shell_service_reentry.py'
      - 'tests/test_critical_shell_service_reentry.py'
      - 'docs/critical_shell_service_reentry.md'
      - '.github/workflows/critical-shell-service-reentry.yml'
      - 'src/critical_annular_carrier_service_reentry.py'
      - 'src/high_strain_resolved_ancestor.py'
      - 'src/coherent_increment_service.py'
      - 'src/common_slice_coefficient_registration.py'
      - 'src/smooth_sgs_first_hit_extraction.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.critical_shell_service_reentry --samples 50000 --outdir results-critical-shell-service-reentry
      - run: python -m src.critical_annular_carrier_service_reentry --samples 50000 --outdir results-critical-annular-carrier-service-reentry
      - run: python -m src.high_strain_resolved_ancestor --samples 50000 --outdir results-high-strain-resolved-ancestor
      - run: python -m src.coherent_increment_service --samples 50000 --outdir results-coherent-increment-service
      - run: cat results-critical-shell-service-reentry/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: critical-shell-service-reentry-results
          path: |
            results-critical-shell-service-reentry/
            results-critical-annular-carrier-service-reentry/
            results-high-strain-resolved-ancestor/
            results-coherent-increment-service/
