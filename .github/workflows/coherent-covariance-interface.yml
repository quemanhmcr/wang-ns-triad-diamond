name: Coherent covariance interface
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.coherent_covariance_interface --samples 50000 --outdir results-coherent-covariance-interface
      - run: cat results-coherent-covariance-interface/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-covariance-interface-results
          path: results-coherent-covariance-interface/
