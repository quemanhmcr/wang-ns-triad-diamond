name: Objective pressure pair atomization

on:
  push:
    paths:
      - 'src/objective_pressure_pair_atomization.py'
      - 'tests/test_objective_pressure_pair_atomization.py'
      - 'docs/objective_pressure_pair_atomization.md'
      - '.github/workflows/objective-pressure-pair-atomization.yml'
      - 'src/resolved_objective_strain_collision.py'
      - 'src/pressure_reservoir_sync.py'
      - 'src/critical_shell_service_reentry.py'
      - 'src/material_label_carrier_quotient.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - name: Objective pressure pair atomization stress
        run: python -m src.objective_pressure_pair_atomization --samples 50000 --outdir results-objective-pressure-pair-atomization
      - name: Resolved objective source dependency
        run: python -m src.resolved_objective_strain_collision --samples 50000 --outdir results-resolved-objective-strain
      - name: Pressure material-pair reuse dependency
        run: python -m src.pressure_reservoir_sync --samples 50000 --outdir results-pressure-reservoir-sync
      - name: Critical shell dependency
        run: python -m src.critical_shell_service_reentry --samples 50000 --outdir results-critical-shell-service-reentry
      - name: Material sidecar quotient dependency
        run: python -m src.material_label_carrier_quotient --samples 50000 --outdir results-material-label-carrier-quotient
      - run: cat results-objective-pressure-pair-atomization/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: objective-pressure-pair-atomization-results
          path: |
            results-objective-pressure-pair-atomization/
            results-resolved-objective-strain/
            results-pressure-reservoir-sync/
            results-critical-shell-service-reentry/
            results-material-label-carrier-quotient/
