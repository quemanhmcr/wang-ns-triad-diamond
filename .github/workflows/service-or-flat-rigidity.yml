name: Service or flat rigidity
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.service_or_flat_rigidity --samples 50000 --outdir results-service-or-flat-rigidity
      - run: cat results-service-or-flat-rigidity/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: service-or-flat-rigidity-results
          path: results-service-or-flat-rigidity/
