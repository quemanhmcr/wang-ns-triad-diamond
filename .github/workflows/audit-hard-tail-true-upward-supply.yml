name: Audit hard-tail true upward supply

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/hard_tail_true_upward_supply.py'
      - 'tests/test_hard_tail_true_upward_supply.py'
      - 'src/hard_tail_true_upward_supply_pde_probe.py'
      - 'tests/test_hard_tail_true_upward_supply_pde_probe.py'
      - 'src/radial_spectral_crossing_layer_cake.py'
      - 'src/radial_spectral_crossing_layer_cake_pde_probe.py'
      - 'src/helical_mode_set_energy_continuity.py'
      - 'src/cyclic_helical_triad_donor_kernel.py'
      - 'src/cyclic_helical_triad_donor_kernel_pde_probe.py'
      - 'src/high_frequency_dissipation_reentry.py'
      - 'src/continuum_helical_edge_measure_registration.py'
      - 'src/continuum_helical_edge_measure_pde_probe.py'
      - 'src/helical.py'
      - '.github/workflows/audit-hard-tail-true-upward-supply.yml'
      - '.github/workflows/hard-tail-true-upward-supply.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  independent-algebra-support-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused theorem and anti-theorem tests
        run: pytest -q tests/test_hard_tail_true_upward_supply.py tests/test_radial_spectral_crossing_layer_cake.py tests/test_helical_mode_set_energy_continuity.py tests/test_cyclic_helical_triad_donor_kernel.py tests/test_high_frequency_dissipation_reentry.py
      - name: Independent 100k true-upward support stress
        run: python -m src.hard_tail_true_upward_supply --samples 100000 --seed 2026081297 --outdir audit-true-upward/analytic
      - name: Independent 100k radial dependency stress
        run: python -m src.radial_spectral_crossing_layer_cake --samples 100000 --seed 2026081294 --outdir audit-true-upward/radial-dependency
      - name: Summary
        run: |
          for f in audit-true-upward/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-hard-tail-true-upward-supply-analytic-results
          path: audit-true-upward/

  independent-actual-ns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused actual NS true-upward tests
        run: pytest -q tests/test_hard_tail_true_upward_supply_pde_probe.py tests/test_radial_spectral_crossing_layer_cake_pde_probe.py
      - name: Longer full-tail plus pure/deep upward audit
        run: >-
          python -m src.hard_tail_true_upward_supply_pde_probe
          --main-resolutions 24 28 --deep-resolutions 20 24
          --main-cutoff 7 --deep-cutoff 2
          --main-steps 96 --deep-steps 32 --closed-tail-resolutions 20 24 --closed-tail-steps 40
          --main-duration 0.0012 --deep-duration 0.00032 --closed-tail-duration 0.00045
          --amplitude 1.3 --outdir audit-true-upward-ns/main
      - name: Longer downward radial referee
        run: >-
          python -m src.radial_spectral_crossing_layer_cake_pde_probe
          --resolutions 24 28 --cutoff 7 --steps 96 --duration 0.0012
          --amplitude 1.3 --radius 8 --phase-sign -1 --outdir audit-true-upward-ns/downward
      - name: Summary
        run: |
          for f in audit-true-upward-ns/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-hard-tail-true-upward-supply-actual-ns-results
          path: audit-true-upward-ns/
