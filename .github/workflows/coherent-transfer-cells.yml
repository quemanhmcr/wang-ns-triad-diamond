name: Coherent transfer cells
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.coherent_transfer_cells --samples 20000 --outdir results-coherent-transfer-cells
      - run: cat results-coherent-transfer-cells/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-transfer-cells-results
          path: results-coherent-transfer-cells/
