name: Weighted causal reuse
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.weighted_causal_reuse --samples 50000 --outdir results-weighted-causal-reuse
      - run: cat results-weighted-causal-reuse/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: weighted-causal-reuse-results
          path: results-weighted-causal-reuse/
