name: Joint causal stop projection
on:
  push:
    paths:
      - 'src/joint_causal_stop_projection.py'
      - 'tests/test_joint_causal_stop_projection.py'
      - 'docs/joint_causal_stop_projection.md'
      - '.github/workflows/joint-causal-stop-projection.yml'
      - 'src/physical_branch_compiler.py'
      - 'src/recursive_physical_witness_constructor.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.joint_causal_stop_projection --samples 50000 --outdir results-joint-causal-stop-projection
      - run: python -m src.recursive_physical_witness_constructor --samples 50000 --outdir results-recursive-physical-witness-constructor
      - run: cat results-joint-causal-stop-projection/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: joint-causal-stop-projection-results
          path: |
            results-joint-causal-stop-projection/
            results-recursive-physical-witness-constructor/
