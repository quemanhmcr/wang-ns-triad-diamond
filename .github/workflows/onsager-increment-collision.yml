name: Onsager increment collision
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.onsager_increment_collision --samples 50000 --outdir results-onsager-increment-collision
      - run: cat results-onsager-increment-collision/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: onsager-increment-collision-results
          path: results-onsager-increment-collision/
