name: resistance-bellman
on:
  workflow_dispatch:
    inputs:
      samples:
        required: false
        default: '3000'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.resistance_bellman --samples "${{ inputs.samples }}" --outdir results-resistance-bellman
      - run: cat results-resistance-bellman/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: resistance-bellman-results, path: results-resistance-bellman/}
