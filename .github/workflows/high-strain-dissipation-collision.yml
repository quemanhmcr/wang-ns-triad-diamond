name: High-strain dissipation collision
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/high_strain_dissipation_collision.py'
      - 'tests/test_high_strain_dissipation_collision.py'
      - 'docs/high_strain_dissipation_collision.md'
      - '.github/workflows/high-strain-dissipation-collision.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.high_strain_dissipation_collision --samples 50000 --outdir results-high-strain-dissipation-collision
      - run: cat results-high-strain-dissipation-collision/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: high-strain-dissipation-collision-results
          path: results-high-strain-dissipation-collision/
