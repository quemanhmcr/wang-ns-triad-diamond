name: H1 covariant source calculus
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.h1_covariant_source --samples 50000 --outdir results-h1-covariant-source
      - run: cat results-h1-covariant-source/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: h1-covariant-source-results
          path: results-h1-covariant-source/
