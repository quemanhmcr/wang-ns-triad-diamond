name: Reservoir pool erosion
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.reservoir_pool_erosion --samples 50000 --outdir results-reservoir-pool-erosion
      - run: cat results-reservoir-pool-erosion/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reservoir-pool-erosion-results
          path: results-reservoir-pool-erosion/
