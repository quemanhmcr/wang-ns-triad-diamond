name: Native material-service causal quotient

on:
  workflow_dispatch:
  push:
    branches:
      - 'theorem/genuine-material-source-service-recurrence'

permissions:
  contents: read

jobs:
  exact-native-material-law:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
      - run: pip install -r requirements.txt python-flint==0.9.0
      - name: Focused material boundary/service quotient theorem
        run: >-
          pytest -q
          tests/test_native_material_service_causal_quotient.py
          tests/test_smooth_quadratic_carrier_interface.py
          tests/test_smooth_relink_donor_quotient.py
          tests/test_heat_edge_material_ownership.py
          tests/test_common_slice_coefficient_registration.py
          tests/test_smooth_sgs_first_hit_extraction.py
          tests/test_physical_branch_compiler.py
          tests/test_joint_causal_stop_projection.py
          tests/test_material_sidecar_stock_central_routing.py
          tests/test_continuum_master_event_quotient.py
      - name: 75k native material/service quotient stress
        run: >-
          python -m src.native_material_service_causal_quotient
          --samples 75000 --seed 2026081307
          --outdir results-native-material-service-causal-quotient/analytic
      - run: cat results-native-material-service-causal-quotient/analytic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-material-service-causal-quotient-analytic-results
          path: results-native-material-service-causal-quotient/

  actual-ns-material-service-referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip
      - run: pip install -r requirements.txt python-flint==0.9.0
      - name: Actual dealiased Fourier-Galerkin NS material-reading anti-theorem
        run: >-
          python -m src.native_material_service_causal_quotient_pde_probe
          --resolutions 24 28 --cutoff 7 --steps 32
          --viscosity 0.03 --amplitude 1.0 --duration 0.001 --phase-sign 1
          --outdir results-native-material-service-causal-quotient-ns/main
      - run: cat results-native-material-service-causal-quotient-ns/main/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: native-material-service-causal-quotient-actual-ns-results
          path: results-native-material-service-causal-quotient-ns/
