name: Audit resolved-contact native binding

on:
  workflow_dispatch:
  push:
    branches:
      - 'theorem/resolved-contact-native-binding'

permissions:
  contents: read

jobs:
  independent-algebra-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused theorem and anti-theorem tests
        run: >-
          pytest -q
          tests/test_resolved_contact_native_binding.py
          tests/test_hard_tail_true_upward_supply.py
          tests/test_resolved_interface_donor_quotient.py
          tests/test_high_tail_natural_window_reentry.py
      - name: Independent 100k native-binding stress
        run: python -m src.resolved_contact_native_binding --samples 100000 --seed 2026081393 --outdir audit-resolved-contact-native/analytic
      - name: Summary
        run: cat audit-resolved-contact-native/analytic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-resolved-contact-native-binding-analytic-results
          path: audit-resolved-contact-native/

  independent-actual-ns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Longer two-cutoff Fourier-Galerkin NS audit
        run: >-
          python -m src.resolved_contact_native_binding_pde_probe
          --resolutions 24 28 --boundary-cutoff 2 --interior-cutoff 3
          --steps 36 --duration 0.0003 --viscosity 0.05 --amplitude 1.3
          --outdir audit-resolved-contact-native-ns/main
      - name: Amplitude adversary
        run: >-
          python -m src.resolved_contact_native_binding_pde_probe
          --resolutions 24 --boundary-cutoff 2 --interior-cutoff 3
          --steps 16 --duration 0.00012 --viscosity 0.05 --amplitude 0.5
          --outdir audit-resolved-contact-native-ns/amplitude-0p5
      - name: Summary
        run: |
          for f in audit-resolved-contact-native-ns/*/summary.md; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-resolved-contact-native-binding-actual-ns-results
          path: audit-resolved-contact-native-ns/
