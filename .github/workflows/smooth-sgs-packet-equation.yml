name: Smooth SGS affine packet equation
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Packet projection and transport stress
        run: python -m src.smooth_sgs_packet_equation --samples 50000 --outdir results-smooth-sgs-packet-equation
      - run: cat results-smooth-sgs-packet-equation/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-sgs-packet-equation-results
          path: results-smooth-sgs-packet-equation/
