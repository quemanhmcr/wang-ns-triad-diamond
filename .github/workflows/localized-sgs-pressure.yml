name: localized-sgs-pressure
on:
  workflow_dispatch:
    inputs:
      samples:
        required: false
        default: '50000'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.localized_sgs_pressure --samples "${{ inputs.samples }}" --outdir results-localized-sgs-pressure
      - run: cat results-localized-sgs-pressure/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: localized-sgs-pressure-results, path: results-localized-sgs-pressure/}
