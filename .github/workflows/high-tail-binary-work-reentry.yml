name: High tail binary work reentry

on:
  push:
    paths:
      - 'src/high_tail_binary_work_reentry.py'
      - 'src/resolved_interface_donor_quotient.py'
      - 'tests/test_high_tail_binary_work_reentry.py'
      - 'docs/high_tail_binary_work_reentry.md'
      - '.github/workflows/high-tail-binary-work-reentry.yml'
      - 'src/high_frequency_dissipation_reentry.py'
      - 'src/recursive_coherent_witness_extraction.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - name: High-tail binary common-work stress
        run: python -m src.high_tail_binary_work_reentry --samples 50000 --outdir results-high-tail-binary-work-reentry
      - name: Resolved interface donor quotient dependency
        run: python -m src.resolved_interface_donor_quotient --samples 50000 --outdir results-resolved-interface-donor-quotient
      - name: High-frequency dissipation dependency
        run: python -m src.high_frequency_dissipation_reentry --samples 50000 --outdir results-high-frequency-dissipation-reentry
      - name: Exact binary coherent-work dependency
        run: python -m src.recursive_coherent_witness_extraction --samples 50000 --outdir results-recursive-coherent-witness
      - run: cat results-high-tail-binary-work-reentry/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: high-tail-binary-work-reentry-results
          path: |
            results-high-tail-binary-work-reentry/
            results-resolved-interface-donor-quotient/
            results-high-frequency-dissipation-reentry/
            results-recursive-coherent-witness/
