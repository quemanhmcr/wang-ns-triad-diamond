name: multicommodity-hodge
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Random Rayleigh checks
        required: false
        default: '20000'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.multicommodity_hodge --samples "${{ inputs.samples }}" --outdir results-multicommodity-hodge
      - run: cat results-multicommodity-hodge/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: multicommodity-hodge-results, path: results-multicommodity-hodge/}
