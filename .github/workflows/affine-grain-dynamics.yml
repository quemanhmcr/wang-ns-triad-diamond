name: affine-grain-dynamics

on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb certificate and affine/Kelvin stress
        run: python -m src.affine_grain_dynamics --samples 50000 --outdir results-affine-grain
      - run: cat results-affine-grain/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-grain-dynamics-results
          path: results-affine-grain/
