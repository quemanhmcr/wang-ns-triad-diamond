name: Heat edge material ownership
on:
  push:
    paths:
      - 'src/heat_edge_material_ownership.py'
      - 'tests/test_heat_edge_material_ownership.py'
      - 'docs/heat_edge_material_ownership.md'
      - '.github/workflows/heat-edge-material-ownership.yml'
      - 'src/high_strain_heat_increment_service.py'
      - 'src/material_coherent_labels.py'
      - 'src/coherent_increment_service.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.heat_edge_material_ownership --samples 50000 --outdir results-heat-edge-material-ownership
      - run: python -m src.high_strain_heat_increment_service --samples 50000 --outdir results-high-strain-heat-increment-service
      - run: python -m src.material_coherent_labels --samples 50000 --outdir results-material-coherent-labels
      - run: cat results-heat-edge-material-ownership/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: heat-edge-material-ownership-results
          path: |
            results-heat-edge-material-ownership/
            results-high-strain-heat-increment-service/
            results-material-coherent-labels/
