name: Physical energy causal integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/physical_energy_causal_bridge.py'
      - 'src/recursive_coherent_witness_extraction.py'
      - 'src/coherent_service_or_flat.py'
      - 'src/complex_young_parent_marking.py'
      - 'src/dual_gaussian_root_registration.py'
      - 'src/bargmann_root_cell_registration.py'
      - 'src/common_slice_coefficient_registration.py'
      - 'src/amplitude_entropy_causal_reuse.py'
      - 'src/weighted_causal_reuse.py'
      - 'src/renyi_causal_reuse.py'
      - 'src/physical_branch_compiler.py'
      - 'src/master_no_escape.py'
      - 'docs/**'
      - 'RESEARCH_LEDGER.md'
      - '.github/workflows/physical-energy-causal-integration.yml'
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - name: Full theorem suite
        run: pytest -q
      - run: python -m src.physical_energy_causal_bridge --samples 50000 --outdir results-integration/physical-energy
      - run: python -m src.recursive_coherent_witness_extraction --samples 20000 --outdir results-integration/coherent-witness
      - run: python -m src.coherent_service_or_flat --samples 50000 --outdir results-integration/service-flat
      - run: python -m src.complex_young_parent_marking --samples 50000 --outdir results-integration/complex-young
      - run: python -m src.dual_gaussian_root_registration --samples 50000 --outdir results-integration/dual-gaussian
      - run: python -m src.bargmann_root_cell_registration --samples 50000 --outdir results-integration/bargmann-anchor
      - run: python -m src.common_slice_coefficient_registration --samples 50000 --outdir results-integration/common-slice
      - run: python -m src.amplitude_entropy_causal_reuse --samples 20000 --outdir results-integration/amplitude-entropy
      - run: python -m src.weighted_causal_reuse --samples 50000 --outdir results-integration/shannon-reuse
      - run: python -m src.renyi_causal_reuse --samples 50000 --outdir results-integration/renyi-reuse
      - run: python -m src.physical_branch_compiler --samples 50000 --outdir results-integration/branch-compiler
      - name: Master episode stress
        run: |
          python - <<'PY'
          import json, math, random
          from src.master_no_escape import MasterStep, master_lower_bound, verify_episode_trace
          rng = random.Random(20260809)
          worst = 1e9
          checked = 0
          for _ in range(20000):
              c0 = 0.04
              kappa = rng.uniform(0.12, 0.30)
              reset = rng.uniform(kappa, 1.4)
              episodes = []
              all_steps = []
              for e in range(rng.randint(1, 12)):
                  p = reset
                  ep = []
                  for _j in range(rng.randint(0, 20)):
                      z = rng.uniform(0.0, 0.015)
                      if p - kappa + z < 0:
                          break
                      p = p - kappa + z
                      s = MasterStep(1.0, 0.0, 0.0, True, z)
                      ep.append(s)
                      all_steps.append(s)
                  episodes.append(ep)
                  if e + 1 < len(episodes):
                      pass
              # Rebuild separators after episode count is known.
              all_steps = []
              for e, ep in enumerate(episodes):
                  all_steps.extend(ep)
                  if e + 1 < len(episodes):
                      cost = rng.uniform(c0, 0.5)
                      eta = rng.uniform(0.0, 0.002)
                      eff = min(1.0, math.exp(-cost) + eta)
                      all_steps.append(MasterStep(eff, cost, eta, False))
              epcheck = verify_episode_trace(episodes, c0=c0, kappa0=kappa, potential_reset=reset)
              if not epcheck['admissible']:
                  raise SystemExit('generated inadmissible episode trace')
              out = master_lower_bound(all_steps, c0=c0, kappa0=kappa, potential_reset=reset)
              actual = sum(-math.log(min(1.0, s.efficiency)) for s in all_steps)
              margin = actual - float(out['log_efficiency_lower_bound'])
              worst = min(worst, margin)
              checked += 1
          result = {'checked': checked, 'worst_margin': worst}
          print(json.dumps(result, indent=2))
          if worst < -1e-10:
              raise SystemExit(1)
          PY
      - name: Integration summary
        run: |
          for f in results-integration/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: physical-energy-causal-integration-results
          path: results-integration/
