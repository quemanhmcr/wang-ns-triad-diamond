name: scale-gap
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Reduced search"
        required: false
        default: "true"
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Search scale gap
        shell: bash
        run: |
          if [[ "${{ inputs.quick }}" == "true" ]]; then
            python -m src.scale_gap --quick --outdir results-scale
          else
            python -m src.scale_gap --outdir results-scale
          fi
      - run: cat results-scale/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: scale-gap-results
          path: results-scale/
