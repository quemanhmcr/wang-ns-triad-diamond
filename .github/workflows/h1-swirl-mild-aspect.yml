name: H1 swirl mild-aspect physical bridge
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.h1_swirl_mild_aspect --samples 50000 --outdir results-h1-swirl-mild-aspect
      - run: cat results-h1-swirl-mild-aspect/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: h1-swirl-mild-aspect-results
          path: results-h1-swirl-mild-aspect/
