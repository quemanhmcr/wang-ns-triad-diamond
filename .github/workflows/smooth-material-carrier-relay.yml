name: Smooth material carrier relay
on:
  push:
    paths:
      - 'src/smooth_material_carrier_relay.py'
      - 'tests/test_smooth_material_carrier_relay.py'
      - 'docs/smooth_material_carrier_relay.md'
      - '.github/workflows/smooth-material-carrier-relay.yml'
      - 'src/material_coherent_labels.py'
      - 'src/physical_energy_causal_bridge.py'
      - 'src/common_slice_coefficient_registration.py'
      - 'src/outer_moving_role_extraction.py'
      - 'src/event_anchored_role_registration.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.smooth_material_carrier_relay --samples 50000 --outdir results-smooth-material-carrier-relay
      - run: python -m src.smooth_sgs_first_hit_extraction --samples 50000 --outdir results-smooth-sgs-first-hit-extraction
      - run: python -m src.physical_energy_causal_bridge --samples 50000 --outdir results-physical-energy-causal-bridge
      - run: python -m src.event_anchored_role_registration --samples 50000 --outdir results-event-anchored-role-registration
      - run: cat results-smooth-material-carrier-relay/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-material-carrier-relay-results
          path: |
            results-smooth-material-carrier-relay/
            results-smooth-sgs-first-hit-extraction/
            results-physical-energy-causal-bridge/
            results-event-anchored-role-registration/
