name: Recursive physical witness constructor
on:
  push:
    paths:
      - 'src/recursive_physical_witness_constructor.py'
      - 'tests/test_recursive_physical_witness_constructor.py'
      - 'docs/recursive_physical_witness_constructor.md'
      - '.github/workflows/recursive-physical-witness-constructor.yml'
      - 'src/physical_pair_weighted_productivity.py'
      - 'src/physical_branch_compiler.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.recursive_physical_witness_constructor --samples 50000 --outdir results-recursive-physical-witness-constructor
      - run: python -m src.physical_pair_weighted_productivity --samples 50000 --outdir results-physical-pair-weighted-productivity
      - run: python -m src.physical_branch_compiler --samples 50000 --outdir results-physical-branch-compiler
      - run: cat results-recursive-physical-witness-constructor/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: recursive-physical-witness-constructor-results
          path: |
            results-recursive-physical-witness-constructor/
            results-physical-pair-weighted-productivity/
            results-physical-branch-compiler/
