name: Affine Gaussian forcing
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Affine Gaussian/Hermite stress
        run: python -m src.affine_gaussian_forcing --samples 50000 --outdir results-affine-gaussian-forcing
      - run: cat results-affine-gaussian-forcing/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-gaussian-forcing-results
          path: results-affine-gaussian-forcing/
