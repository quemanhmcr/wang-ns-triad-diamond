name: helical-phase-holonomy
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb phase certificate and diamond stress
        run: python -m src.helical_phase_holonomy --samples 50000 --outdir results-helical-holonomy
      - run: cat results-helical-holonomy/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: helical-phase-holonomy-results
          path: results-helical-holonomy/
