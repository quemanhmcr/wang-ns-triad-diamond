name: Audit cyclic helical triad donor kernel

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/cyclic_helical_triad_donor_kernel.py'
      - 'tests/test_cyclic_helical_triad_donor_kernel.py'
      - 'src/cyclic_helical_triad_donor_kernel_pde_probe.py'
      - 'tests/test_cyclic_helical_triad_donor_kernel_pde_probe.py'
      - 'src/helical.py'
      - 'src/helical_physical_edge_registration.py'
      - 'src/continuum_helical_edge_measure_registration.py'
      - 'src/canonical_positive_edge_work_routing.py'
      - 'src/mixed_fate_reserved_young_handoff.py'
      - 'src/continuum_helical_edge_measure_pde_probe.py'
      - 'src/mixed_fate_reserved_young_handoff_pde_probe.py'
      - '.github/workflows/audit-cyclic-helical-triad-donor-kernel.yml'
      - '.github/workflows/cyclic-helical-triad-donor-kernel.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  independent-algebra-provenance-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused theorem and anti-theorem tests
        run: pytest -q tests/test_cyclic_helical_triad_donor_kernel.py tests/test_helical_physical_edge_registration.py tests/test_canonical_positive_edge_work_routing.py tests/test_mixed_fate_reserved_young_handoff.py
      - name: Independent 100k closed-triad stress
        run: python -m src.cyclic_helical_triad_donor_kernel --samples 100000 --seed 2026081291 --outdir results-audit-cyclic-donor/analytic
      - name: Independent helical edge stress
        run: python -m src.helical_physical_edge_registration --samples 50000 --outdir results-audit-cyclic-donor/helical-edge
      - run: cat results-audit-cyclic-donor/analytic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-cyclic-helical-triad-donor-kernel-analytic-results
          path: results-audit-cyclic-donor/

  independent-actual-ns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused actual-NS theorem test
        run: pytest -q tests/test_cyclic_helical_triad_donor_kernel_pde_probe.py
      - name: Longer same-system representation audit
        run: python -m src.cyclic_helical_triad_donor_kernel_pde_probe --resolutions 24 28 --cutoff 7 --steps 48 --amplitude 1.3 --duration 0.0012 --snapshots 6 --outdir results-audit-cyclic-donor-ns/main
      - name: Canonical mixed-fate actual-NS dependency
        run: python -m src.mixed_fate_reserved_young_handoff_pde_probe --resolution 24 --steps 32 --duration 0.001 --snapshots 5 --tau 0.1 --outdir results-audit-cyclic-donor-ns/mixed-fate
      - run: cat results-audit-cyclic-donor-ns/main/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-cyclic-helical-triad-donor-kernel-actual-ns-results
          path: results-audit-cyclic-donor-ns/
