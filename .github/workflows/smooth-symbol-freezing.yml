name: smooth-symbol-freezing
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smooth-symbol freezing stress
        run: python -m src.smooth_symbol_freezing --samples 50000 --outdir results-symbol-freezing
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-symbol-freezing-results
          path: results-symbol-freezing/
