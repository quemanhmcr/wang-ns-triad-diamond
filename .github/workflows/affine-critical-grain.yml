name: Affine critical grain
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Affine critical-grain certificate and stress
        run: python -m src.affine_critical_grain --samples 50000 --outdir results-affine-critical-grain
      - run: cat results-affine-critical-grain/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-critical-grain-results
          path: results-affine-critical-grain/
