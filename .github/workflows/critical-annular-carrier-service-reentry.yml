name: Critical annular carrier service reentry

on:
  push:
    paths:
      - 'src/critical_annular_carrier_service_reentry.py'
      - 'tests/test_critical_annular_carrier_service_reentry.py'
      - 'docs/critical_annular_carrier_service_reentry.md'
      - '.github/workflows/critical-annular-carrier-service-reentry.yml'
      - 'src/nn_seed_temporal_first_stop.py'
      - 'src/nn_critical_heat_carrier_seed.py'
      - 'src/amplitude_entropy_causal_reuse.py'
      - 'src/heat_edge_material_ownership.py'
      - 'src/coherent_service_stopping.py'
      - 'src/reservoir_pool_erosion.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.critical_annular_carrier_service_reentry --samples 50000 --outdir results-critical-annular-carrier-service-reentry
      - run: python -m src.nn_seed_temporal_first_stop --samples 50000 --outdir results-nn-seed-temporal-first-stop
      - run: python -m src.coherent_service_stopping --samples 50000 --outdir results-coherent-service-stopping
      - run: python -m src.heat_edge_material_ownership --samples 50000 --outdir results-heat-edge-material-ownership
      - run: cat results-critical-annular-carrier-service-reentry/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: critical-annular-carrier-service-reentry-results
          path: |
            results-critical-annular-carrier-service-reentry/
            results-nn-seed-temporal-first-stop/
            results-coherent-service-stopping/
            results-heat-edge-material-ownership/
