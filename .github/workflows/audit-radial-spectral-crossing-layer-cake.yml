name: Audit radial spectral crossing layer cake

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/radial_spectral_crossing_layer_cake.py'
      - 'tests/test_radial_spectral_crossing_layer_cake.py'
      - 'src/radial_spectral_crossing_layer_cake_pde_probe.py'
      - 'tests/test_radial_spectral_crossing_layer_cake_pde_probe.py'
      - 'src/helical_mode_set_energy_continuity.py'
      - 'src/cyclic_helical_triad_donor_kernel.py'
      - 'src/cyclic_helical_triad_donor_kernel_pde_probe.py'
      - 'src/continuum_helical_edge_measure_registration.py'
      - 'src/continuum_helical_edge_measure_pde_probe.py'
      - 'src/helical.py'
      - '.github/workflows/audit-radial-spectral-crossing-layer-cake.yml'
      - '.github/workflows/radial-spectral-crossing-layer-cake.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  independent-algebra-crossing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused theorem and anti-theorem tests
        run: pytest -q tests/test_radial_spectral_crossing_layer_cake.py tests/test_helical_mode_set_energy_continuity.py tests/test_cyclic_helical_triad_donor_kernel.py
      - name: Independent 100k radial crossing stress
        run: python -m src.radial_spectral_crossing_layer_cake --samples 100000 --seed 2026081294 --outdir audit-radial-crossing/analytic
      - name: Independent mode-continuity stress
        run: python -m src.helical_mode_set_energy_continuity --samples 100000 --seed 2026081293 --outdir audit-radial-crossing/mode-continuity-dependency
      - name: Summary
        run: |
          cat audit-radial-crossing/analytic/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat audit-radial-crossing/mode-continuity-dependency/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-radial-spectral-crossing-layer-cake-analytic-results
          path: audit-radial-crossing/

  independent-actual-ns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused actual NS radial tests
        run: pytest -q tests/test_radial_spectral_crossing_layer_cake_pde_probe.py tests/test_helical_mode_set_energy_continuity_pde_probe.py
      - name: Longer actual NS upward crossing audit
        run: python -m src.radial_spectral_crossing_layer_cake_pde_probe --resolutions 24 28 --cutoff 7 --steps 96 --duration 0.0012 --amplitude 1.3 --radius 8 --phase-sign 1 --outdir audit-radial-crossing-ns/upward
      - name: Longer actual NS downward crossing audit
        run: python -m src.radial_spectral_crossing_layer_cake_pde_probe --resolutions 24 28 --cutoff 7 --steps 96 --duration 0.0012 --amplitude 1.3 --radius 8 --phase-sign -1 --outdir audit-radial-crossing-ns/downward
      - name: Boundary-radius adversaries
        run: |
          for R in 6.5 8.0 10.0; do
            tag=${R/./p}
            python -m src.radial_spectral_crossing_layer_cake_pde_probe \
              --resolutions 24 --cutoff 7 --steps 48 --duration 0.00075 --amplitude 1.0 --radius "$R" --phase-sign 1 \
              --outdir "audit-radial-crossing-ns/radius-$tag"
          done
      - name: Summary
        run: |
          for f in audit-radial-crossing-ns/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-radial-spectral-crossing-layer-cake-actual-ns-results
          path: audit-radial-crossing-ns/
