name: First hit heat reservoir erosion

on:
  push:
    paths:
      - 'src/first_hit_heat_reservoir_erosion.py'
      - 'tests/test_first_hit_heat_reservoir_erosion.py'
      - 'docs/first_hit_heat_reservoir_erosion.md'
      - '.github/workflows/first-hit-heat-reservoir-erosion.yml'
      - 'src/high_strain_heat_increment_service.py'
      - 'src/heat_edge_material_ownership.py'
      - 'src/smooth_sgs_first_hit_extraction.py'
      - 'src/ancestor_reservoir_sync.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.first_hit_heat_reservoir_erosion --samples 50000 --outdir results-first-hit-heat-reservoir-erosion
      - run: python -m src.high_strain_heat_increment_service --samples 50000 --outdir results-high-strain-heat-increment-service
      - run: python -m src.heat_edge_material_ownership --samples 50000 --outdir results-heat-edge-material-ownership
      - run: python -m src.smooth_sgs_first_hit_extraction --samples 50000 --outdir results-smooth-sgs-first-hit-extraction
      - run: cat results-first-hit-heat-reservoir-erosion/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: first-hit-heat-reservoir-erosion-results
          path: |
            results-first-hit-heat-reservoir-erosion/
            results-high-strain-heat-increment-service/
            results-heat-edge-material-ownership/
            results-smooth-sgs-first-hit-extraction/
