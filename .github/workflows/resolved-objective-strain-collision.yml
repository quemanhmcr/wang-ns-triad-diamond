name: Resolved objective-strain collision
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/resolved_objective_strain_collision.py'
      - 'tests/test_resolved_objective_strain_collision.py'
      - 'docs/resolved_objective_strain_collision.md'
      - '.github/workflows/resolved-objective-strain-collision.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.resolved_objective_strain_collision --samples 50000 --outdir results-resolved-objective-strain-collision
      - run: cat results-resolved-objective-strain-collision/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-objective-strain-collision-results
          path: results-resolved-objective-strain-collision/
