name: Continuum master event quotient

on:
  push:
    paths:
      - 'src/continuum_master_event_quotient.py'
      - 'tests/test_continuum_master_event_quotient.py'
      - 'docs/continuum_master_event_quotient.md'
      - '.github/workflows/continuum-master-event-quotient.yml'
      - 'src/high_strain_resolved_ancestor.py'
      - 'src/critical_shell_service_reentry.py'
      - 'src/high_tail_natural_window_reentry.py'
      - 'src/fresh_service_scale_reentry.py'
      - 'src/objective_pressure_pair_atomization.py'
      - 'src/joint_causal_stop_projection.py'
      - 'src/smooth_sgs_first_hit_extraction.py'
      - 'src/physical_branch_compiler.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - name: Continuum event-quotient stress
        run: python -m src.continuum_master_event_quotient --samples 50000 --outdir results-continuum-master-event-quotient
      - name: Generic critical-shell dependency
        run: python -m src.critical_shell_service_reentry --samples 50000 --outdir results-critical-shell-service-reentry
      - name: High-tail natural-window dependency
        run: python -m src.high_tail_natural_window_reentry --samples 50000 --outdir results-high-tail-natural-window-reentry
      - run: cat results-continuum-master-event-quotient/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-master-event-quotient-results
          path: |
            results-continuum-master-event-quotient/
            results-critical-shell-service-reentry/
            results-high-tail-natural-window-reentry/
