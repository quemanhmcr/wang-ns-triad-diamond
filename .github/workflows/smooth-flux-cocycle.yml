name: smooth-flux-cocycle
on:
  workflow_dispatch:
    inputs:
      samples:
        required: false
        default: '50000'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.smooth_flux_cocycle --samples "${{ inputs.samples }}" --outdir results-smooth-flux
      - run: cat results-smooth-flux/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: smooth-flux-cocycle-results, path: results-smooth-flux/}
