name: sgs-flux-bridge
on:
  workflow_dispatch:
    inputs:
      samples:
        required: false
        default: '200'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.sgs_flux_bridge --samples "${{ inputs.samples }}" --grid 12 --outdir results-sgs-flux
      - run: cat results-sgs-flux/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: sgs-flux-bridge-results, path: results-sgs-flux/}
