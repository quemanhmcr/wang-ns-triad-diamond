name: Audit full natural service corridor

on:
  push:
    branches:
      - 'audit/full-natural-service-corridor-e351'
    paths:
      - 'src/full_natural_service_corridor_quotient.py'
      - 'src/critical_shell_service_reentry.py'
      - 'src/nn_seed_temporal_first_stop.py'
      - 'src/full_natural_service_corridor_pde_probe.py'
      - 'tests/test_full_natural_service_corridor_audit.py'
      - 'tests/test_full_natural_service_corridor_pde_probe.py'
      - '.github/workflows/audit-full-natural-service-corridor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-boundary-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Run scale, provenance, and positivity anti-tests
        run: pytest -q tests/test_full_natural_service_corridor_audit.py
      - name: Run full theorem suite
        run: pytest -q
      - name: Run wide-dynamic-range corridor stress
        run: python -m src.full_natural_service_corridor_quotient --samples 200000 --outdir results-audit/full-natural-service-corridor
      - name: Run generic critical-shell dependency stress
        run: python -m src.critical_shell_service_reentry --samples 100000 --outdir results-audit/critical-shell-service-reentry
      - name: Run high-strain corridor dependency stress
        run: python -m src.high_strain_critical_carrier_reentry --samples 100000 --outdir results-audit/high-strain-critical-carrier-reentry
      - name: Run actual dealiased Navier-Stokes corridor probe
        run: python -m src.full_natural_service_corridor_pde_probe --resolutions 12 16 20 --steps 80 --outdir results-audit/full-natural-service-corridor-pde-probe
      - run: cat results-audit/full-natural-service-corridor/summary.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat results-audit/full-natural-service-corridor-pde-probe/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-full-natural-service-corridor-results
          path: results-audit/
