name: NN critical heat carrier seed

on:
  push:
    paths:
      - 'src/nn_critical_heat_carrier_seed.py'
      - 'tests/test_nn_critical_heat_carrier_seed.py'
      - 'docs/nn_critical_heat_carrier_seed.md'
      - '.github/workflows/nn-critical-heat-carrier-seed.yml'
      - 'src/old_incident_heat_erosion.py'
      - 'src/high_strain_resolved_ancestor.py'
      - 'src/outer_moving_role_extraction.py'
      - 'src/event_anchored_role_registration.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.nn_critical_heat_carrier_seed --samples 50000 --outdir results-nn-critical-heat-carrier-seed
      - run: python -m src.old_incident_heat_erosion --samples 50000 --outdir results-old-incident-heat-erosion
      - run: python -m src.outer_moving_role_extraction --samples 50000 --outdir results-outer-moving-role-extraction
      - run: python -m src.event_anchored_role_registration --samples 50000 --outdir results-event-anchored-role-registration
      - run: cat results-nn-critical-heat-carrier-seed/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nn-critical-heat-carrier-seed-results
          path: |
            results-nn-critical-heat-carrier-seed/
            results-old-incident-heat-erosion/
            results-outer-moving-role-extraction/
            results-event-anchored-role-registration/
