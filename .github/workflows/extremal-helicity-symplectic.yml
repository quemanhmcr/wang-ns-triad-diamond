name: extremal-helicity-symplectic
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Arb symplectic-helicity certificate and stress
        run: python -m src.extremal_helicity_symplectic --samples 50000 --outdir results-helicity-symplectic
      - run: cat results-helicity-symplectic/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: extremal-helicity-symplectic-results
          path: results-helicity-symplectic/
