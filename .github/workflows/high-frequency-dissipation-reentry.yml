name: High frequency dissipation reentry

on:
  push:
    paths:
      - 'src/high_frequency_dissipation_reentry.py'
      - 'tests/test_high_frequency_dissipation_reentry.py'
      - 'docs/high_frequency_dissipation_reentry.md'
      - '.github/workflows/high-frequency-dissipation-reentry.yml'
      - 'src/coherent_increment_service.py'
      - 'src/objective_source_routing_compiler.py'
      - 'src/critical_shell_service_reentry.py'
      - 'src/event_anchored_role_registration.py'
      - 'src/outer_moving_role_extraction.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - name: Coherent increment service dependency
        run: python -m src.coherent_increment_service --samples 50000 --outdir results-coherent-increment-service
      - name: High-frequency dissipation reentry stress
        run: python -m src.high_frequency_dissipation_reentry --samples 50000 --outdir results-high-frequency-dissipation-reentry
      - name: Objective source compiler dependency
        run: python -m src.objective_source_routing_compiler --samples 50000 --outdir results-objective-source-routing-compiler
      - name: Critical shell dependency
        run: python -m src.critical_shell_service_reentry --samples 50000 --outdir results-critical-shell-service-reentry
      - name: Event role dependency
        run: python -m src.event_anchored_role_registration --samples 50000 --outdir results-event-role
      - name: Outer role dependency
        run: python -m src.outer_moving_role_extraction --samples 50000 --outdir results-outer-role
      - run: cat results-high-frequency-dissipation-reentry/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: high-frequency-dissipation-reentry-results
          path: |
            results-coherent-increment-service/
            results-high-frequency-dissipation-reentry/
            results-objective-source-routing-compiler/
            results-critical-shell-service-reentry/
            results-event-role/
            results-outer-role/
