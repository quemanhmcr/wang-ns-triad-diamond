name: Flat companion gate
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.flat_companion_gate --samples 50000 --outdir results-flat-companion-gate
      - run: cat results-flat-companion-gate/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flat-companion-gate-results
          path: results-flat-companion-gate/
