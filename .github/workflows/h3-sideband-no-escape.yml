name: H3 sideband local no-escape
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.h3_sideband_no_escape --samples 50000 --outdir results-h3-sideband-no-escape
      - run: cat results-h3-sideband-no-escape/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: h3-sideband-no-escape-results
          path: results-h3-sideband-no-escape/
