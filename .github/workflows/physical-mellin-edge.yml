name: physical-mellin-edge
on: workflow_dispatch
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.physical_mellin_edge --outdir results-physical-mellin
      - run: cat results-physical-mellin/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: physical-mellin-edge-results, path: results-physical-mellin/}
