name: Audit canonical positive edge-work routing

on:
  push:
    paths:
      - 'src/canonical_positive_edge_work_routing.py'
      - 'tests/test_canonical_positive_edge_work_routing.py'
      - 'src/canonical_positive_edge_work_routing_pde_probe.py'
      - 'tests/test_canonical_positive_edge_work_routing_pde_probe.py'
      - 'src/continuum_helical_edge_measure_registration.py'
      - 'src/continuum_helical_edge_measure_pde_probe.py'
      - 'src/helical_physical_edge_registration.py'
      - 'src/helical.py'
      - 'src/event_anchored_role_registration.py'
      - 'src/coherent_service_or_flat.py'
      - 'tests/test_coherent_service_or_flat.py'
      - 'src/high_tail_binary_work_reentry.py'
      - 'tests/test_high_tail_binary_work_reentry.py'
      - 'src/recursive_coherent_witness_extraction.py'
      - 'src/physical_branch_compiler.py'
      - 'src/joint_causal_stop_projection.py'
      - '.github/workflows/audit-canonical-positive-edge-work-routing.yml'
      - '.github/workflows/canonical-positive-edge-work-routing.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-routing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused routing and stage-zero anti-tests
        run: pytest -q tests/test_canonical_positive_edge_work_routing.py tests/test_physical_branch_compiler.py tests/test_joint_causal_stop_projection.py tests/test_recursive_coherent_witness_extraction.py tests/test_high_tail_binary_work_reentry.py
      - name: Full theorem suite
        run: pytest -q
      - name: Wide canonical routing stress
        run: python -m src.canonical_positive_edge_work_routing --samples 75000 --seed 2026081201 --outdir results-audit-canonical-positive-edge-routing
      - name: Helical invariance dependency
        run: python -m src.helical_physical_edge_registration --samples 50000 --outdir results-audit-helical-edge
      - run: cat results-audit-canonical-positive-edge-routing/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-canonical-positive-edge-routing-results
          path: |
            results-audit-canonical-positive-edge-routing/
            results-audit-helical-edge/

  actual-ns-routing-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused actual-NS routing test
        run: pytest -q tests/test_canonical_positive_edge_work_routing_pde_probe.py
      - name: Evolve actual Galerkin NS and route its canonical positive edge law
        run: python -m src.canonical_positive_edge_work_routing_pde_probe --resolution 24 --steps 64 --duration 0.008 --snapshots 5 --tau 0.1 --outdir results-audit-canonical-positive-edge-routing-pde
      - name: Existing continuum actual-NS dependency
        run: python -m src.continuum_helical_edge_measure_pde_probe --resolutions 20 24 28 --steps 64 --duration 0.012 --snapshots 5 --outdir results-audit-continuum-edge-pde
      - run: cat results-audit-canonical-positive-edge-routing-pde/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-canonical-positive-edge-routing-pde-results
          path: |
            results-audit-canonical-positive-edge-routing-pde/
            results-audit-continuum-edge-pde/
