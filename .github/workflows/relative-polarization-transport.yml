name: Relative polarization transport
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Relative polarization stress
        run: python -m src.relative_polarization_transport --samples 50000 --outdir results-relative-polarization
      - run: cat results-relative-polarization/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: relative-polarization-transport-results
          path: results-relative-polarization/
