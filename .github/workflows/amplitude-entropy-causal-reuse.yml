name: Amplitude entropy causal reuse
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/amplitude_entropy_causal_reuse.py'
      - 'tests/test_amplitude_entropy_causal_reuse.py'
      - 'docs/amplitude_entropy_causal_reuse.md'
      - '.github/workflows/amplitude-entropy-causal-reuse.yml'
      - 'src/dual_gaussian_root_registration.py'
      - 'src/bargmann_root_cell_registration.py'
      - 'src/weighted_causal_reuse.py'
      - 'src/renyi_causal_reuse.py'
      - 'RESEARCH_LEDGER.md'
      - 'docs/master_no_escape.md'
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.amplitude_entropy_causal_reuse --samples 20000 --outdir results-amplitude-entropy-causal-reuse
      - run: cat results-amplitude-entropy-causal-reuse/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: amplitude-entropy-causal-reuse-results
          path: results-amplitude-entropy-causal-reuse/
