name: Affine coherent-state Bessel
on:
  workflow_dispatch:
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.affine_coherent_bessel --samples 50000 --outdir results-affine-coherent-bessel
      - run: cat results-affine-coherent-bessel/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: affine-coherent-bessel-results
          path: results-affine-coherent-bessel/
