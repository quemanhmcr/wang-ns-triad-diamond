name: High tail ultraviolet locality

on:
  push:
    paths:
      - 'src/high_tail_ultraviolet_locality.py'
      - 'tests/test_high_tail_ultraviolet_locality.py'
      - 'docs/high_tail_ultraviolet_locality.md'
      - '.github/workflows/high-tail-ultraviolet-locality.yml'
      - 'src/high_tail_binary_work_reentry.py'
      - 'src/physical_pair_weighted_productivity.py'
      - 'src/critical_shell_service_reentry.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - name: Ultraviolet locality stress
        run: python -m src.high_tail_ultraviolet_locality --samples 50000 --outdir results-high-tail-ultraviolet-locality
      - name: Common-unit high-tail dependency
        run: python -m src.high_tail_binary_work_reentry --samples 50000 --outdir results-high-tail-binary-work-reentry
      - name: Physical pair-work dependency
        run: python -m src.physical_pair_weighted_productivity --samples 50000 --outdir results-physical-pair-productivity
      - name: Generic critical-shell dependency
        run: python -m src.critical_shell_service_reentry --samples 50000 --outdir results-critical-shell-service-reentry
      - run: cat results-high-tail-ultraviolet-locality/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: high-tail-ultraviolet-locality-results
          path: |
            results-high-tail-ultraviolet-locality/
            results-high-tail-binary-work-reentry/
            results-physical-pair-productivity/
            results-critical-shell-service-reentry/
