name: Nonaffine role interface work
on:
  push:
    paths:
      - 'src/nonaffine_role_interface_work.py'
      - 'tests/test_nonaffine_role_interface_work.py'
      - 'docs/nonaffine_role_interface_work.md'
      - '.github/workflows/nonaffine-role-interface-work.yml'
      - 'src/outer_moving_role_extraction.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.nonaffine_role_interface_work --samples 50000 --outdir results-nonaffine-role-interface-work
      - run: python -m src.outer_moving_role_extraction --samples 50000 --outdir results-outer-moving-role-extraction
      - run: cat results-nonaffine-role-interface-work/summary.md >> "$GITHUB_STEP_SUMMARY"
      - run: cat results-outer-moving-role-extraction/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nonaffine-role-interface-work-results
          path: |
            results-nonaffine-role-interface-work/
            results-outer-moving-role-extraction/
