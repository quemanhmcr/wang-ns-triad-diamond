name: Full natural checkpoint quotient

on:
  push:
    paths:
      - 'src/full_natural_checkpoint_quotient.py'
      - 'src/same_carrier_checkpoint_segmentation_quotient.py'
      - 'tests/test_full_natural_checkpoint_quotient.py'
      - 'docs/full_natural_checkpoint_quotient.md'
      - '.github/workflows/full-natural-checkpoint-quotient.yml'
      - 'src/full_natural_service_corridor_quotient.py'
      - 'src/critical_shell_service_reentry.py'
      - 'src/continuum_master_event_quotient.py'
      - 'src/high_frequency_dissipation_reentry.py'
      - 'tests/test_full_natural_service_corridor_quotient.py'
      - 'tests/test_continuum_master_event_quotient.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Full theorem suite
        run: pytest -q
      - name: Full-natural checkpoint quotient stress
        run: python -m src.full_natural_checkpoint_quotient --samples 50000 --outdir results-full-natural-checkpoint-quotient
      - name: Same-carrier checkpoint segmentation dependency
        run: python -m src.same_carrier_checkpoint_segmentation_quotient --samples 50000 --outdir results-same-carrier-checkpoint-segmentation
      - name: Full-natural service corridor dependency
        run: python -m src.full_natural_service_corridor_quotient --samples 50000 --outdir results-full-natural-service-corridor-quotient
      - name: Generic critical-shell dependency
        run: python -m src.critical_shell_service_reentry --samples 50000 --outdir results-critical-shell-service-reentry
      - name: Continuum master checkpoint barrier
        run: python -m src.continuum_master_event_quotient --samples 50000 --outdir results-continuum-master-event-quotient
      - name: Physical high-tail dependency
        run: python -m src.high_frequency_dissipation_reentry --samples 50000 --outdir results-high-frequency-dissipation-reentry
      - run: cat results-full-natural-checkpoint-quotient/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-natural-checkpoint-quotient-results
          path: |
            results-full-natural-checkpoint-quotient/
            results-same-carrier-checkpoint-segmentation/
            results-full-natural-service-corridor-quotient/
            results-critical-shell-service-reentry/
            results-continuum-master-event-quotient/
            results-high-frequency-dissipation-reentry/
