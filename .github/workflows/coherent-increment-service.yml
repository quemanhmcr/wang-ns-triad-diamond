name: Coherent increment service
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.coherent_increment_service --samples 50000 --outdir results-coherent-increment-service
      - run: cat results-coherent-increment-service/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coherent-increment-service-results
          path: results-coherent-increment-service/
