name: High strain critical carrier reentry

on:
  push:
    paths:
      - 'src/high_strain_critical_carrier_reentry.py'
      - 'tests/test_high_strain_critical_carrier_reentry.py'
      - 'docs/high_strain_critical_carrier_reentry.md'
      - '.github/workflows/high-strain-critical-carrier-reentry.yml'
      - 'src/high_strain_resolved_ancestor.py'
      - 'src/critical_annular_carrier_service_reentry.py'
      - 'src/nn_critical_heat_carrier_seed.py'
      - 'src/common_slice_coefficient_registration.py'
      - 'src/smooth_sgs_first_hit_extraction.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - run: pytest -q
      - run: python -m src.high_strain_critical_carrier_reentry --samples 50000 --outdir results-high-strain-critical-carrier-reentry
      - run: python -m src.critical_annular_carrier_service_reentry --samples 50000 --outdir results-critical-annular-carrier-service-reentry
      - run: python -m src.high_strain_resolved_ancestor --samples 50000 --outdir results-high-strain-resolved-ancestor
      - run: cat results-high-strain-critical-carrier-reentry/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: high-strain-critical-carrier-reentry-results
          path: |
            results-high-strain-critical-carrier-reentry/
            results-critical-annular-carrier-service-reentry/
            results-high-strain-resolved-ancestor/
