name: Smooth quadratic carrier interface

on:
  push:
    paths:
      - 'src/smooth_quadratic_carrier_interface.py'
      - 'src/smooth_relink_donor_quotient.py'
      - 'tests/test_smooth_relink_donor_quotient.py'
      - 'docs/smooth_relink_donor_quotient.md'
      - 'tests/test_smooth_quadratic_carrier_interface.py'
      - 'docs/smooth_quadratic_carrier_interface.md'
      - '.github/workflows/smooth-quadratic-carrier-interface.yml'
      - 'src/outer_moving_role_extraction.py'
      - 'src/nonaffine_role_interface_work.py'
      - 'src/resolved_interface_donor_quotient.py'
      - 'src/event_anchored_role_registration.py'
      - 'src/smooth_material_carrier_relay.py'
      - 'src/physical_energy_causal_bridge.py'
      - 'src/continuum_master_event_quotient.py'
      - 'src/common_slice_coefficient_registration.py'
      - 'src/critical_shell_service_reentry.py'
      - 'src/high_strain_critical_carrier_reentry.py'
      - 'src/nn_seed_temporal_first_stop.py'
      - 'src/material_label_carrier_quotient.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Full theorem suite
        run: pytest -q
      - name: Smooth quadratic-carrier interface stress
        run: python -m src.smooth_quadratic_carrier_interface --samples 50000 --outdir results-smooth-quadratic-carrier-interface
      - name: Smooth relink donor quotient dependency
        run: python -m src.smooth_relink_donor_quotient --samples 50000 --outdir results-smooth-relink-donor-quotient
      - name: Direct outer moving-role dependency
        run: python -m src.outer_moving_role_extraction --samples 50000 --outdir results-outer-moving-role-extraction
      - name: Hard-projector interface dependency
        run: python -m src.nonaffine_role_interface_work --samples 50000 --outdir results-nonaffine-role-interface-work
      - name: Hard-event donor quotient compatibility
        run: python -m src.resolved_interface_donor_quotient --samples 50000 --outdir results-resolved-interface-donor-quotient
      - name: Hard-event smooth-envelope registration dependency
        run: python -m src.event_anchored_role_registration --samples 50000 --outdir results-event-anchored-role-registration
      - name: Smooth material-carrier relay dependency
        run: python -m src.smooth_material_carrier_relay --samples 50000 --outdir results-smooth-material-carrier-relay
      - name: Physical-energy causal gate dependency
        run: python -m src.physical_energy_causal_bridge --samples 50000 --outdir results-physical-energy-causal-bridge
      - name: Canonical master obstruction-type barrier
        run: python -m src.continuum_master_event_quotient --samples 50000 --outdir results-continuum-master-event-quotient
      - run: cat results-smooth-quadratic-carrier-interface/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-quadratic-carrier-interface-results
          path: |
            results-smooth-quadratic-carrier-interface/
            results-smooth-relink-donor-quotient/
            results-outer-moving-role-extraction/
            results-nonaffine-role-interface-work/
            results-resolved-interface-donor-quotient/
            results-event-anchored-role-registration/
            results-smooth-material-carrier-relay/
            results-physical-energy-causal-bridge/
            results-continuum-master-event-quotient/
