name: log-scale-flux
on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Deterministic local retention grid budget"
        required: false
        default: "10000"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.log_scale_flux --samples "${{ inputs.samples }}" --outdir results-log-scale-flux
      - run: cat results-log-scale-flux/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: log-scale-flux-results, path: results-log-scale-flux/}
