name: Curvature sideband irreducible split
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.curvature_sideband_irrep --samples 50000 --outdir results-curvature-sideband-irrep
      - run: cat results-curvature-sideband-irrep/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: curvature-sideband-irrep-results
          path: results-curvature-sideband-irrep/
