name: transfer-profile-extraction
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Transfer-profile algebra stress
        run: python -m src.transfer_profile_extraction --samples 100000 --outdir results-transfer-profile
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-profile-extraction-results
          path: results-transfer-profile/
