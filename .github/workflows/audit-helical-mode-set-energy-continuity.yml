name: Audit helical mode-set energy continuity

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/helical_mode_set_energy_continuity.py'
      - 'tests/test_helical_mode_set_energy_continuity.py'
      - 'src/helical_mode_set_energy_continuity_pde_probe.py'
      - 'tests/test_helical_mode_set_energy_continuity_pde_probe.py'
      - 'src/cyclic_helical_triad_donor_kernel.py'
      - 'src/cyclic_hard_cell_single_charge_quotient.py'
      - 'src/continuum_helical_edge_measure_registration.py'
      - 'src/continuum_helical_edge_measure_pde_probe.py'
      - 'src/helical.py'
      - '.github/workflows/audit-helical-mode-set-energy-continuity.yml'
      - '.github/workflows/helical-mode-set-energy-continuity.yml'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  independent-algebra-flow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused theorem and anti-theorem tests
        run: pytest -q tests/test_helical_mode_set_energy_continuity.py tests/test_cyclic_helical_triad_donor_kernel.py tests/test_cyclic_hard_cell_single_charge_quotient.py tests/test_continuum_helical_edge_measure_registration.py
      - name: Independent 100k physical mode-set stress
        run: python -m src.helical_mode_set_energy_continuity --samples 100000 --seed 2026081293 --outdir audit-mode-continuity/analytic
      - name: Independent cyclic donor provenance stress
        run: python -m src.cyclic_helical_triad_donor_kernel --samples 100000 --seed 2026081291 --outdir audit-mode-continuity/cyclic-dependency
      - name: Summary
        run: |
          cat audit-mode-continuity/analytic/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat audit-mode-continuity/cyclic-dependency/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-helical-mode-set-energy-continuity-analytic-results
          path: audit-mode-continuity/

  independent-actual-ns-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt python-flint
      - name: Focused actual NS continuity tests
        run: pytest -q tests/test_helical_mode_set_energy_continuity_pde_probe.py tests/test_continuum_helical_edge_measure_pde_probe.py
      - name: Longer actual NS selected-helicity audit
        run: python -m src.helical_mode_set_energy_continuity_pde_probe --resolutions 24 28 --cutoff 7 --steps 96 --duration 0.0012 --amplitude 1.3 --helicity 1 --phase-sign 1 --outdir audit-mode-continuity-ns/main
      - name: Longer sign-reversed actual NS audit
        run: python -m src.helical_mode_set_energy_continuity_pde_probe --resolutions 24 28 --cutoff 7 --steps 96 --duration 0.0012 --amplitude 1.3 --helicity 1 --phase-sign -1 --outdir audit-mode-continuity-ns/negative-phase
      - name: Longer opposite-helicity actual NS audit
        run: python -m src.helical_mode_set_energy_continuity_pde_probe --resolutions 24 28 --cutoff 7 --steps 96 --duration 0.0012 --amplitude 1.3 --helicity -1 --phase-sign 1 --outdir audit-mode-continuity-ns/opposite-helicity
      - name: Summary
        run: |
          for f in audit-mode-continuity-ns/*/summary.md; do
            echo >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: audit-helical-mode-set-energy-continuity-actual-ns-results
          path: audit-mode-continuity-ns/
