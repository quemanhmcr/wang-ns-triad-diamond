name: Packet base-spinor cross forcing
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt python-flint==0.8.0
      - run: pytest -q
      - name: Cross forcing stress
        run: python -m src.packet_cross_forcing --samples 50000 --outdir results-packet-cross-forcing
      - run: cat results-packet-cross-forcing/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: packet-cross-forcing-results
          path: results-packet-cross-forcing/
