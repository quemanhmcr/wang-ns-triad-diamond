name: multiscale-bellman
on:
  workflow_dispatch:
    inputs:
      samples:
        description: Random refinement checks
        required: false
        default: "50000"
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.multiscale_bellman --samples "${{ inputs.samples }}" --outdir results-multiscale
      - run: cat results-multiscale/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: multiscale-bellman-results, path: results-multiscale/}
