[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wang-ns-triad-diamond"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
